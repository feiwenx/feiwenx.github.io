<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration: a child's crayon drawing of a robot with the letters AI, beside crayons, toy blocks, and a small toy robot">
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2.6" fill="#1d2125" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#efeafc"/>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <!-- drawing paper -->
  <g transform="rotate(-6 560 440)">
    <rect x="364" y="164" width="420" height="540" fill="#1d2125" fill-opacity="0.14"/>
    <rect x="350" y="150" width="420" height="540" fill="#ffffff" stroke="#1d2125" stroke-width="6"/>
    <!-- crayon robot -->
    <g fill="none" stroke="#ff8a65" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M452 262 Q 520 254 584 262 Q 590 320 584 372 Q 520 378 454 372 Q 448 320 452 262 Z"/>
      <path d="M518 258 V 222"/>
      <path d="M470 380 Q 520 384 566 380 L 572 500 Q 518 506 466 500 Z"/>
      <path d="M466 410 L 420 450 M 572 410 L 616 446"/>
      <path d="M488 502 V 548 M 548 502 V 548"/>
      <path d="M490 342 Q 518 360 548 342"/>
    </g>
    <circle cx="518" cy="212" r="12" fill="#ffd43b"/>
    <circle cx="492" cy="306" r="9" fill="#1d2125"/>
    <circle cx="546" cy="306" r="9" fill="#1d2125"/>
    <!-- crayon sun -->
    <circle cx="700" cy="232" r="28" fill="#ffd43b"/>
    <g stroke="#ffd43b" stroke-width="8" stroke-linecap="round">
      <path d="M700 186v-14M700 292v-14M654 232h-14M760 232h-14M668 200l-10-10M742 274l-10-10M732 200l10-10M658 274l10-10"/>
    </g>
    <!-- crayon letters "AI" -->
    <g fill="none" stroke="#058cf2" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M452 660 L 482 584 L 512 660 M 466 632 L 498 632"/>
      <path d="M556 584 V 660 M 538 584 H 574 M 538 660 H 574"/>
    </g>
    <path d="M640 620 q 16 -26 30 0 q 14 -26 30 0 q -2 24 -30 42 q -28 -18 -30 -42 z" fill="#ff8a65"/>
  </g>

  <!-- crayons -->
  <g stroke="#1d2125" stroke-width="5" stroke-linejoin="round">
    <g transform="translate(846 640) rotate(-30)">
      <rect x="0" y="0" width="190" height="34" rx="6" fill="#ff8a65"/>
      <path d="M190 0 L 228 17 L 190 34 Z" fill="#ff8a65"/>
      <path d="M30 0v34M160 0v34" stroke-opacity="0.5"/>
    </g>
    <g transform="translate(876 706) rotate(-30)">
      <rect x="0" y="0" width="190" height="34" rx="6" fill="#058cf2"/>
      <path d="M190 0 L 228 17 L 190 34 Z" fill="#058cf2"/>
      <path d="M30 0v34M160 0v34" stroke-opacity="0.5"/>
    </g>
    <g transform="translate(906 772) rotate(-30)">
      <rect x="0" y="0" width="190" height="34" rx="6" fill="#59c9a5"/>
      <path d="M190 0 L 228 17 L 190 34 Z" fill="#59c9a5"/>
      <path d="M30 0v34M160 0v34" stroke-opacity="0.5"/>
    </g>
  </g>

  <!-- toy blocks -->
  <g stroke="#1d2125" stroke-width="6" stroke-linejoin="round">
    <rect x="132" y="652" width="130" height="130" rx="8" fill="#1d2125" fill-opacity="0.14" stroke="none"/>
    <rect x="120" y="640" width="130" height="130" rx="8" fill="#ffd43b"/>
    <path d="M185 676l12 26 28 4-20 20 5 28-25-14-25 14 5-28-20-20 28-4z" fill="#ffffff" stroke-width="5"/>
    <rect x="182" y="522" width="118" height="118" rx="8" fill="#1d2125" fill-opacity="0.14" stroke="none"/>
    <rect x="170" y="510" width="118" height="118" rx="8" fill="#8cc8f8"/>
    <circle cx="229" cy="569" r="28" fill="#ffffff" stroke-width="5"/>
    <circle cx="229" cy="569" r="10" fill="#1d2125" stroke="none"/>
  </g>

  <!-- small toy robot -->
  <g stroke="#1d2125" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M968 236V198"/>
    <circle cx="968" cy="186" r="14" fill="#ff8a65"/>
    <rect x="910" y="236" width="116" height="96" rx="20" fill="#ffffff"/>
    <rect x="928" y="256" width="80" height="50" rx="14" fill="#1d2125"/>
    <circle cx="950" cy="281" r="8" fill="#8cd3ff" stroke="none"/>
    <circle cx="986" cy="281" r="8" fill="#8cd3ff" stroke="none"/>
    <rect x="922" y="332" width="92" height="84" rx="16" fill="#58c9a5"/>
    <circle cx="968" cy="374" r="12" fill="#ffd43b"/>
  </g>

  <!-- sparkle -->
  <path d="M1080 120l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#058cf2"/>
</svg>
